name: CI

on:
  push:
    branches: [main]

# One run per branch: a new push cancels the previous run of the same ref,
# so CI does not keep burning a runner on a commit nobody will look at again.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every step below is one call into `tool/arch.dart`, the same CLI a person
# runs locally — `make verify` runs this list, in this order, on a laptop.
# The steps are kept separate rather than folded into one `verify` call so
# that GitHub's UI names the one that failed; the logic is still in one place,
# and there is no second implementation of the gate to drift.
#
# The CLI notices it is here (CI=true) and prints plain, appended lines
# instead of repainting a dashboard — see tool/src/tty.dart.

jobs:
  build_and_test:
    name: Build & Test Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          # Single source of truth for the Flutter version: `.fvmrc`, the same
          # file local FVM and `make fvm` read.
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: make setup

      - name: Verify formatting
        run: make format

      - name: Analyze code (lint)
        run: make analyze

      # Regenerates every generated file from scratch — build_runner's four
      # suffixes and the localizations — and fails if the result differs from
      # what is committed. That covers three checks the workflow used to spell
      # out by hand: generated files out of date, ARB files edited without a
      # regenerate, and a message left untranslated in some locale.
      - name: Codegen gate
        run: dart run tool/arch.dart codegen-gate

      # The whole suite: the architecture assertions and the CLI's own tests
      # first, then the unit tests layer by layer, then widget and
      # integration. Coverage rides along with it, which is what the gate
      # below reads.
      - name: Run tests
        run: make flutter-test

      - name: Coverage gate
        run: make coverage-gate
